name: Z6 F9a manual development layout evidence
on:
  push:
    branches: [codex/z6-f9a-devlayout]
  pull_request:
    branches: [main]
    paths:
      - 'z6/f9a/devlayout-codex/**'
      - '.github/workflows/z6-f9a-devlayout.yml'
permissions:
  contents: read
jobs:
  manual-layout-evidence:
    if: github.head_ref == 'codex/z6-f9a-devlayout' || github.ref == 'refs/heads/codex/z6-f9a-devlayout'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate recorded layout and package lifecycle provenance
        run: python z6/f9a/devlayout-codex/verify.py
